[package]
name = "nekotone-voice-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["ml", "gpu", "player"]
ml = ["dep:ort", "dep:tokenizers", "dep:ureq", "dep:sha2", "dep:hex"]
gpu = ["ml"]
player = ["dep:cpal"]
cuda = ["ml", "ort/cuda", "ort/load-dynamic"]
server = ["ml", "dep:tiny_http"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
symphonia.workspace = true
rubato.workspace = true
lofty.workspace = true
realfft.workspace = true
ndarray.workspace = true
blake3.workspace = true
dirs.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rayon.workspace = true
chrono.workspace = true
cpal = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, optional = true, features = ["directml", "nvrtx"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
miniz_oxide = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
