[package]
name = "nekotone-voice-cli"
description = "voicekit: run the compute server from the command line, manage its models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "voicekit"
path = "src/main.rs"

[dependencies]
nekotone-voice-core = { path = "../nekotone-voice-core", features = ["server"] }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
# `voicekit service`: run the compute server as a Windows service (MIT/Apache-2.0)
windows-service = "0.8"

[features]
# CUDA for `voicekit serve` on a Linux GPU server (see nekotone-voice-core's `cuda`).
cuda = ["nekotone-voice-core/cuda"]

[dev-dependencies]
tempfile = "3"
