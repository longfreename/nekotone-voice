[package]
name = "voicekit-app"
description = "Voicekit: the trimmed Tauri shell for voice changing, cloning, and TTS"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "voicekit-studio"

[workspace]

[lib]
name = "voicekit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voicekit-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nekotone-voice-core = { path = "../../crates/nekotone-voice-core", features = ["server"] }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
panic = "unwind"
